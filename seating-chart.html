<style>
  :root {
    --paper: #FFFFFF;
    --paper-dim: #F1F1F1;
    --ink: #1A1A1A;
    --ink-soft: #666666;
    --green: #C8102E;
    --green-deep: #1A1A1A;
    --gold: #1A1A1A;
    --gold-soft: #F6D7DA;
    --brick: #C8102E;
    --line: #E0E0E0;
    --white: #FFFFFF;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-logo {
    height: 36px;
    width: auto;
    display: block;
  }

  .brand h1 {
    font-size: 22px;
    margin: 0;
    color: var(--green-deep);
  }

  .brand .tag {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .auth-area {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }

  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: var(--white);
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  .pill-btn:hover { background: var(--green-deep); }
  .pill-btn.secondary {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .pill-btn.secondary:hover { border-color: var(--ink-soft); color: var(--ink); }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-soft);
  }
  .user-chip img {
    width: 26px; height: 26px; border-radius: 50%;
  }

  /* ---------- Config gate ---------- */
  .gate {
    max-width: 560px;
    margin: 80px auto;
    padding: 32px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .gate h2 { margin-top: 0; }
  .gate p { color: var(--ink-soft); line-height: 1.55; }
  .gate code {
    display: block;
    background: var(--paper-dim);
    padding: 12px;
    border-radius: 6px;
    font-size: 12.5px;
    white-space: pre-wrap;
    margin: 12px 0;
  }

  .signin-gate {
    max-width: 420px;
    margin: 100px auto;
    text-align: center;
    padding: 40px 32px;
  }
  .signin-gate h2 { margin-bottom: 8px; }
  .signin-gate p { color: var(--ink-soft); margin-bottom: 24px; }
  .signin-logo {
    height: 84px;
    width: auto;
    margin: 0 auto 20px auto;
    display: block;
  }

  /* ---------- Layout ---------- */
  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .sidebar {
    width: 300px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    padding: 20px;
    overflow-y: auto;
  }

  .sidebar h3 {
    font-size: 13px;
    text-transform: none;
    color: var(--ink-soft);
    margin: 0 0 12px 0;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
  }

  .section { margin-bottom: 28px; }

  .chart-list { display: flex; flex-direction: column; gap: 6px; }
  .chart-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 10px;
    border-radius: 7px;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .chart-item:hover { background: var(--paper-dim); }
  .chart-item.active {
    background: var(--gold-soft);
    color: var(--green-deep);
    font-weight: 600;
  }
  .chart-item.drag-over {
    outline: 2px dashed var(--gold);
    outline-offset: -2px;
  }
  .chart-item .del {
    opacity: 0;
    color: var(--brick);
    font-size: 12px;
    padding: 2px 6px;
  }
  .chart-item:hover .del { opacity: 1; }

  .roster-add {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .roster-add input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
    background: var(--white);
  }
  .roster-add button {
    background: var(--green);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 600;
  }

  .roster-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 340px;
    overflow-y: auto;
  }

  .roster-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 13.5px;
    background: var(--paper-dim);
    cursor: grab;
    border: 1px solid transparent;
  }
  .roster-chip.placed {
    opacity: 0.4;
  }
  .roster-chip:active { cursor: grabbing; }
  .roster-chip .rm {
    color: var(--ink-soft);
    font-size: 12px;
    padding: 2px 4px;
  }
  .roster-chip .rm:hover { color: var(--brick); }

  .empty-note {
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.5;
  }

  /* ---------- Main / chart canvas ---------- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .chart-toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .chart-name-input {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--green-deep);
    outline: none;
    min-width: 160px;
  }

  .dim-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .dim-control input {
    width: 44px;
    padding: 5px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
  }

  .spacer { flex: 1; }

  .save-status {
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .canvas-wrap {
    flex: 1;
    overflow: auto;
    padding: 32px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .board-frame {
    display: inline-block;
  }

  .front-label {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--green);
    letter-spacing: 0.02em;
  }

  .grid {
    display: grid;
    gap: 14px;
  }

  .desk {
    width: 128px;
    height: 84px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
    font-size: 13.5px;
    font-weight: 600;
    position: relative;
    transition: border-color 0.12s ease, background 0.12s ease;
  }

  .desk.empty {
    background: var(--paper-dim);
    border: 1.5px dashed var(--line);
    color: var(--ink-soft);
    font-weight: 400;
    font-size: 12px;
  }

  .desk.filled {
    background: var(--white);
    border: 1.5px solid var(--green);
    color: var(--ink);
  }

  .desk.drag-over {
    border-color: var(--gold);
    background: var(--gold-soft);
  }

  .desk .clear-seat {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0;
  }
  .desk.filled:hover .clear-seat { opacity: 1; }
  .desk .clear-seat:hover { color: var(--brick); }

  .empty-roster-hint {
    max-width: 640px;
    margin: 60px auto;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.6;
  }

  @media print {
    .topbar, .sidebar, .chart-toolbar { display: none !important; }
    .canvas-wrap { padding: 0; }
    body { background: white; }
  }

  @media (max-width: 720px) {
    .sidebar { width: 220px; }
    .desk { width: 96px; height: 68px; font-size: 12px; }
  }

  /* ---------- Import modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-box {
    background: var(--white);
    border-radius: var(--radius);
    padding: 28px;
    width: 480px;
    max-width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-box h3 {
    margin: 0 0 6px 0;
    font-size: 19px;
    color: var(--green-deep);
  }
  .modal-box .hint {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin-bottom: 16px;
  }
  .modal-box .file-row {
    margin-bottom: 14px;
    font-size: 13.5px;
  }
  .modal-box .file-row input[type="file"] {
    display: block;
    margin-top: 6px;
    font-size: 13px;
  }
  .modal-box .or-divider {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    margin: 4px 0 12px 0;
  }
  .modal-box textarea {
    width: 100%;
    min-height: 140px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-family: inherit;
    font-size: 13.5px;
    resize: vertical;
    margin-bottom: 6px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 14px;
  }

  /* ---------- Layout toggle ---------- */
  .toggle-group {
    display: flex;
    gap: 2px;
    background: var(--paper-dim);
    padding: 3px;
    border-radius: 8px;
  }
  .toggle-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
  }
  .toggle-btn.active {
    background: var(--green);
    color: var(--white);
  }

  /* ---------- Table layout ---------- */
  .table-unit {
    width: 100%;
    height: 100%;
    background: var(--paper-dim);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .table-surface {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .table-seats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    width: 100%;
    flex: 1;
  }
  .table-seat {
    background: var(--white);
    border: 1.5px dashed var(--line);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3px;
    position: relative;
  }
  .table-seat.filled {
    border: 1.5px solid var(--green);
    color: var(--ink);
  }
  .table-seat.drag-over {
    border-color: var(--gold);
    background: var(--gold-soft);
  }
  .table-seat .clear-seat {
    position: absolute;
    top: 2px;
    right: 3px;
    font-size: 9px;
    color: var(--ink-soft);
    opacity: 0;
  }
  .table-seat.filled:hover .clear-seat { opacity: 1; }
</style>
</head>

/* =========================================================
   3. FIRESTORE SYNC
   ========================================================= */
function docRef() {
  return db.collection('teachers').doc(state.user.uid);
}

function loadData() {
  docRef().get().then(snap => {
    if (snap.exists) {
      const data = snap.data();
      const legacyStudents = data.students || [];
      state.charts = data.charts || {};
      // Migrate any chart that predates per-class rosters: give it its own
      // copy of the old shared roster (same ids, so existing seats still line up).
      Object.values(state.charts).forEach(c => {
        if (!c.students) {
          c.students = legacyStudents.map(s => ({ ...s }));
        }
        // Migrate to layout-type-aware seat keys: old charts have no
        // layoutType/capacity and seat keys shaped "row-col" (2 parts).
        // New charts use "row-col-seatIndex" (3 parts) so a unit can hold
        // more than one student (tables).
        if (!c.layoutType) {
          c.layoutType = 'desks';
          c.capacity = 1;
          const migrated = {};
          Object.entries(c.seats || {}).forEach(([k, v]) => {
            const parts = k.split('-');
            migrated[parts.length === 2 ? `${parts[0]}-${parts[1]}-0` : k] = v;
          });
          c.seats = migrated;
        }
      });
      // Explicit ordering for the class list (falls back to whatever order
      // existed if this is the first load since the reordering feature).
      const savedOrder = Array.isArray(data.chartOrder) ? data.chartOrder : [];
      state.chartOrder = savedOrder.filter(id => state.charts[id]);
      Object.keys(state.charts).forEach(id => {
        if (!state.chartOrder.includes(id)) state.chartOrder.push(id);
      });
    } else {
      // first time: seed with one empty chart
      const id = uid();
      state.charts = { [id]: { name: "Period 1", rows: 4, cols: 6, layoutType: 'desks', capacity: 1, seats: {}, students: [] } };
      state.chartOrder = [id];
    }
    state.activeChartId = state.chartOrder.length ? state.chartOrder[0] : null;
    state.loading = false;
    render();
  }).catch(err => {
    console.error(err);
    state.loading = false;
    state.saveStatus = "Couldn't load data — check your Firestore rules.";
    render();
  });
}

function persist() {
  state.saveStatus = "Saving…";
  render();
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(() => {
    // Full overwrite (no merge) — deleted classes are stored as a nested map
    // field, and Firestore's merge:true deep-merges maps rather than
    // replacing them, so a merge write would silently resurrect anything
    // deleted locally. We always hold the complete state, so a plain
    // overwrite is correct and is what actually removes deleted classes.
    docRef().set({
      charts: state.charts,
      chartOrder: state.chartOrder
    }).then(() => {
      state.saveStatus = "Saved";
      render();
    }).catch(err => {
      console.error(err);
      state.saveStatus = "Save failed";
      render();
    });
  }, 500);
}

function removeStudent(id) {
  const chart = state.charts[state.activeChartId];
  if (!chart) return;
  chart.students = chart.students.filter(s => s.id !== id);

    if (chart.seats[k] === id) delete chart.seats[k];
  });
  persist();
  render();
}

/* ---- CSV / mass import ---- */

function splitCSVLine(line) {
  const fields = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      fields.push(cur.trim());
      cur = '';
    } else {
      cur += ch;
    }
  }
  fields.push(cur.trim());
  return fields.map(f => f.replace(/^"|"$/g, '').trim());
}

function parseNamesFromText(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length === 0) return [];

  let rows = lines.map(splitCSVLine);

  // Detect an optional header row and which columns hold names.
  const headerWords = ['name', 'student', 'student name', 'full name', 'first name', 'first', 'last name', 'last'];
  const firstRowLower = rows[0].map(f => f.toLowerCase());
  const looksLikeHeader = rows[0].length > 1 && firstRowLower.some(f => headerWords.includes(f));

  let nameIdx = -1, firstIdx = -1, lastIdx = -1;
  if (looksLikeHeader) {
    firstRowLower.forEach((f, i) => {
      if (f === 'first name' || f === 'first') firstIdx = i;
      else if (f === 'last name' || f === 'last') lastIdx = i;
      else if (nameIdx === -1 && (f === 'name' || f === 'student' || f === 'student name' || f === 'full name')) nameIdx = i;
    });
    rows = rows.slice(1);
  }

  const names = [];
  rows.forEach(fields => {
    if (fields.every(f => !f)) return;
    let name;
    if (firstIdx !== -1 && lastIdx !== -1) {
      name = `${fields[firstIdx] || ''} ${fields[lastIdx] || ''}`.trim();
    } else if (nameIdx !== -1) {
      name = fields[nameIdx];
    } else if (fields.length >= 2) {
      // No header, two+ columns: assume "Last, First" (common export format)
      name = `${fields[1]} ${fields[0]}`.trim();
    } else {
      name = fields[0];
    }
    name = (name || '').replace(/\s+/g, ' ').trim();
    if (name) names.push(name);
  });

  return names;
}

function openImportModal() {
  state.showImportModal = true;
  state.importText = '';
  render();
}

function closeImportModal() {
  state.showImportModal = false;
  state.importText = '';
  render();
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    state.importText = ev.target.result;
    const textarea = document.getElementById('import-textarea');
    if (textarea) textarea.value = state.importText;
  };
  reader.readAsText(file);
}

function doImport() {
  const chart = state.charts[state.activeChartId];
  if (!chart) {
    alert("Create or select a class first.");
    return;
  }
  const names = parseNamesFromText(state.importText);
  if (names.length === 0) {
    alert("No names found. Paste a list of names or choose a CSV file first.");
    return;
  }
  const existingLower = new Set(chart.students.map(s => s.name.toLowerCase()));
  let added = 0, skipped = 0;
  names.forEach(name => {
    if (existingLower.has(name.toLowerCase())) { skipped++; return; }
    chart.students.push({ id: uid(), name });
    existingLower.add(name.toLowerCase());
    added++;
  });
  state.showImportModal = false;
  state.importText = '';
  persist();
  render();
  alert(`Imported ${added} student${added === 1 ? '' : 's'}.` + (skipped ? ` Skipped ${skipped} duplicate${skipped === 1 ? '' : 's'}.` : ''));
}

function addChart() {
  const name = prompt("Name this class (e.g. \"Period 3\" or \"Homeroom\"):", "New Class");
  if (name === null) return;
  const id = uid();
  state.charts[id] = { name: name.trim() || "New Class", rows: 4, cols: 6, layoutType: 'desks', capacity: 1, seats: {}, students: [] };
  state.chartOrder.push(id);
  state.activeChartId = id;
  persist();
  render();
}

function deleteChart(id) {
  if (!confirm("Delete this class and its seating chart? This can't be undone.")) return;
  delete state.charts[id];
  state.chartOrder = state.chartOrder.filter(cid => cid !== id);
  state.activeChartId = state.chartOrder.length ? state.chartOrder[0] : null;
  persist();
  render();
}

function reorderChart(draggedId, targetId) {
  if (!draggedId || draggedId === targetId) return;
  const order = state.chartOrder;
  const fromIdx = order.indexOf(draggedId);
  const targetIdx = order.indexOf(targetId);
  if (fromIdx === -1 || targetIdx === -1) return;
  order.splice(fromIdx, 1);
  const insertAt = order.indexOf(targetId);
  order.splice(insertAt, 0, draggedId);
  persist();
  render();
}

function renameChart(id, name) {
  state.charts[id].name = name;
  persist();
}

function resizeChart(id, rows, cols) {
  const c = state.charts[id];
  c.rows = Math.max(1, Math.min(12, rows));
  c.cols = Math.max(1, Math.min(12, cols));
  // drop seats outside new bounds
  Object.keys(c.seats).forEach(k => {
    const [r, cIdx] = k.split('-').map(Number);
    if (r >= c.rows || cIdx >= c.cols) delete c.seats[k];
  });
  persist();
  render();
}

function setLayoutType(chartId, type) {
  const c = state.charts[chartId];
  if (c.layoutType === type) return;
  if (Object.keys(c.seats).length > 0) {
    if (!confirm("Switching layout clears the current seat placements (students stay on your roster). Continue?")) return;
  }
  c.layoutType = type;
  c.capacity = type === 'tables' ? 6 : 1;
  c.seats = {};
  persist();
  render();
}

function setCapacity(chartId, capacity) {
  const c = state.charts[chartId];
  capacity = Math.max(1, Math.min(6, capacity || 6));
  if (capacity === c.capacity) return;
  Object.keys(c.seats).forEach(k => {
    const seatIdx = Number(k.split('-')[2]);
    if (seatIdx >= capacity) delete c.seats[k];
  });
  c.capacity = capacity;
  persist();
  render();
}

// Places a student in a seat. If dragged directly from another seat and the
// target is occupied, the two students swap; otherwise the student simply
// moves (vacating wherever they were).
function moveOrSwapStudent(chartId, studentId, targetKey, fromKey) {
  const c = state.charts[chartId];
  const occupant = c.seats[targetKey];
  if (fromKey && fromKey !== targetKey && occupant && occupant !== studentId) {
    c.seats[fromKey] = occupant;
    c.seats[targetKey] = studentId;
  } else {
    Object.keys(c.seats).forEach(k => {
      if (c.seats[k] === studentId) delete c.seats[k];
    });
    c.seats[targetKey] = studentId;
  }
  persist();
  render();
}

function clearSeat(chartId, seatKey) {
  delete state.charts[chartId].seats[seatKey];
  persist();
  render();
}

function clearAllSeats(chartId) {
  const c = state.charts[chartId];
  if (Object.keys(c.seats).length === 0) {
    alert("No one is seated yet.");
    return;
  }
  if (!confirm("Remove everyone from their seats? Students stay on the roster — just unseated.")) return;
  c.seats = {};
  persist();
  render();
}

function shuffleChart(chartId) {
  const c = state.charts[chartId];
  const placedIds = new Set(Object.values(c.seats));
  const seated = c.students.filter(s => placedIds.has(s.id));
  const pool = [...seated];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const keys = Object.keys(c.seats);
  const newSeats = {};
  keys.forEach((k, i) => { if (pool[i]) newSeats[k] = pool[i].id; });
  c.seats = newSeats;
  persist();
  render();
}

// Randomly fills every empty seat, always placing the next student at
// whichever table/desk currently has the fewest people — so with tables,
// students end up spread evenly rather than filling one table before
// moving to the next.
function fillAllSeats(chartId) {
  const c = state.charts[chartId];
  const placedIds = new Set(Object.values(c.seats));
  const unplaced = c.students.filter(s => !placedIds.has(s.id));
  if (unplaced.length === 0) {
    alert("Everyone on the roster already has a seat.");
    return;
  }
  for (let i = unplaced.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [unplaced[i], unplaced[j]] = [unplaced[j], unplaced[i]];
  }

  const units = [];
  for (let r = 0; r < c.rows; r++) {
    for (let col = 0; col < c.cols; col++) {
      const emptySeats = [];
      let occupied = 0;
      for (let s = 0; s < c.capacity; s++) {
        const key = `${r}-${col}-${s}`;
        if (c.seats[key]) occupied++;
        else emptySeats.push(key);
      }
      units.push({ emptySeats, occupied });
    }
  }

  let placed = 0;
  for (const student of unplaced) {
    let best = null;
    for (const u of units) {
      if (u.emptySeats.length === 0) continue;
      if (!best || u.occupied < best.occupied) best = u;
    }
    if (!best) break;
    const key = best.emptySeats.shift();
    c.seats[key] = student.id;
    best.occupied++;
    placed++;
  }

  persist();
  render();
  if (placed < unplaced.length) {
    alert(`Seated ${placed} student${placed === 1 ? '' : 's'}. There aren't enough empty seats for the remaining ${unplaced.length - placed} — add more rows/columns or tables.`);
  }
}

/* =========================================================
   6. RENDER
   ========================================================= */
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k === 'html') node.innerHTML = v;
    else node.setAttribute(k, v);
  });
  children.forEach(c => { if (c) node.appendChild(c); });
  return node;
}
const text = (t) => document.createTextNode(t);

function renderImportModal() {
  const overlay = el('div', {
    class: 'modal-overlay',
    onclick: (e) => { if (e.target === overlay) closeImportModal(); }
  });

  const box = el('div', { class: 'modal-box' });
  box.appendChild(el('h3', {}, [text('Import students')]));
  box.appendChild(el('div', { class: 'hint' }, [
    text('Upload a CSV file, or paste a list of names below — one per line. A header row (Name, or First Name / Last Name) is detected automatically if present.')
  ]));

  const fileRow = el('div', { class: 'file-row' }, [
    text('CSV or text file:'),
    el('input', { type: 'file', accept: '.csv,.txt', onchange: handleFileSelect })
  ]);
  box.appendChild(fileRow);
  box.appendChild(el('div', { class: 'or-divider' }, [text('— or paste below —')]));

  const textarea = el('textarea', {
    id: 'import-textarea',
    placeholder: 'Jane Smith\nJohn Doe\n...',
    oninput: (e) => { state.importText = e.target.value; }
  });
  textarea.value = state.importText;
  box.appendChild(textarea);

  const actions = el('div', { class: 'modal-actions' }, [
    el('button', { class: 'pill-btn secondary', onclick: closeImportModal }, [text('Cancel')]),
    el('button', { class: 'pill-btn', onclick: doImport }, [text('Import')])
  ]);
  box.appendChild(actions);

  overlay.appendChild(box);
  return overlay;
}

function render() {
  root.innerHTML = '';

  if (!CONFIG_IS_SET) {
    root.appendChild(renderConfigGate());
    return;
  }

  if (state.loading) {
    root.appendChild(el('div', { style: 'padding:60px;text-align:center;color:var(--ink-soft)' }, [text('Loading…')]));
    return;
  }

  if (!state.user) {
    root.appendChild(renderTopbar());
    root.appendChild(renderSignInGate());
    return;
  }

  const wrap = el('div', {});
  wrap.appendChild(renderTopbar());

  const layout = el('div', { class: 'layout' });
  layout.appendChild(renderSidebar());
  layout.appendChild(renderMain());
  wrap.appendChild(layout);

  root.appendChild(wrap);

  if (state.showImportModal) {
    root.appendChild(renderImportModal());
  }
}

function renderConfigGate() {
  return el('div', { class: 'gate' }, [
    el('h2', {}, [text('Almost ready')]),
    el('p', {}, [text('This app needs your Firebase config to connect to your database. Open the ')]),
    el('p', {}, [text('Paste your firebaseConfig object into the JavaScript near the top of this file, where it says "PASTE_YOUR_...".')]),
    el('code', {}, [text('const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  ...\n};')]),
    el('p', {}, [text('Once that\'s filled in, reload this page.')])
  ]);
}

function renderTopbar() {
  const bar = el('div', { class: 'topbar' });
  bar.appendChild(el('div', { class: 'brand' }, [
    el('img', { src: LOGO_DATA_URI, alt: 'School logo', class: 'brand-logo' }),
    el('h1', {}, [text('Seating Chart')]),
    el('span', { class: 'tag' }, [text('for your classroom')])
  ]));

  const authArea = el('div', { class: 'auth-area' });
  if (state.user) {
    authArea.appendChild(el('a', {
      href: 'behavior-tracker.html',
      class: 'pill-btn secondary'
    }, [text('Behavior Tracker →')]));
    const chip = el('div', { class: 'user-chip' });
    if (state.user.photoURL) chip.appendChild(el('img', { src: state.user.photoURL, alt: '' }));
    chip.appendChild(text(state.user.displayName || state.user.email));
    authArea.appendChild(chip);
    authArea.appendChild(el('button', { class: 'pill-btn secondary', onclick: signOut }, [text('Sign out')]));
  }
  bar.appendChild(authArea);
  return bar;
}

function renderSignInGate() {
  return el('div', { class: 'signin-gate' }, [
    el('img', { src: LOGO_DATA_URI, alt: 'School logo', class: 'signin-logo' }),
    el('h2', {}, [text('Sign in to continue')]),
    el('p', {}, [text('Your rosters and charts are saved to your account and sync across any computer you sign into.')]),
    el('button', { class: 'pill-btn', onclick: signIn }, [text('Sign in with Google')])
  ]);
}

function renderSidebar() {
  const side = el('div', { class: 'sidebar' });

  // Classes section
  const chartsSection = el('div', { class: 'section' });
  chartsSection.appendChild(el('h3', {}, [text('Classes')]));
  const list = el('div', { class: 'chart-list' });
  state.chartOrder.forEach(id => {
    const c = state.charts[id];
    if (!c) return;
    const item = el('div', {
      class: 'chart-item' + (id === state.activeChartId ? ' active' : ''),
      draggable: 'true',
      onclick: () => { state.activeChartId = id; render(); },
      ondragstart: (e) => {
        state.dragChartId = id;
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'move';
      },
      ondragover: (e) => { e.preventDefault(); item.classList.add('drag-over'); },
      ondragleave: () => { item.classList.remove('drag-over'); },
      ondrop: (e) => {
        e.preventDefault();
        item.classList.remove('drag-over');
        reorderChart(state.dragChartId, id);
        state.dragChartId = null;
      },
      ondragend: () => { item.classList.remove('drag-over'); }
    }, [
      text(c.name),
      el('span', {
        class: 'del',
        onclick: (e) => { e.stopPropagation(); deleteChart(id); }
      }, [text('Delete')])
    ]);
    list.appendChild(item);
  });
  chartsSection.appendChild(list);
  chartsSection.appendChild(el('button', {
    class: 'pill-btn secondary', style: 'margin-top:10px;width:100%;justify-content:center',
    onclick: addChart
  }, [text('+ New class')]));
  side.appendChild(chartsSection);

  // Roster section — scoped to the active chart/class
  const activeChart = state.charts[state.activeChartId];
  const rosterSection = el('div', { class: 'section' });
  rosterSection.appendChild(el('h3', {}, [
    text(activeChart ? `Roster — ${activeChart.name} (${activeChart.students.length})` : 'Roster')
  ]));

  if (!activeChart) {
    rosterSection.appendChild(el('div', { class: 'empty-note' }, [
      text('Create or select a class above to add students.')
    ]));
    side.appendChild(rosterSection);
    return side;
  }

  const addRow = el('div', { class: 'roster-add' });
  const input = el('input', { placeholder: 'Student name', type: 'text' });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { addStudent(input.value); input.value = ''; }
  });
  const addBtn = el('button', {
    onclick: () => { addStudent(input.value); input.value = ''; }
  }, [text('Add')]);
  addRow.appendChild(input);
  addRow.appendChild(addBtn);
  rosterSection.appendChild(addRow);

  rosterSection.appendChild(el('button', {
    class: 'pill-btn secondary', style: 'width:100%;justify-content:center;margin-bottom:14px',
    onclick: openImportModal
  }, [text('Import list or CSV')]));

  if (activeChart.students.length === 0) {
    rosterSection.appendChild(el('div', { class: 'empty-note' }, [
      text('Add students to this class above, then drag their names onto desks in the chart.')
    ]));
  } else {
    const placedIds = new Set(Object.values(activeChart.seats));
    const rlist = el('div', { class: 'roster-list' });
    activeChart.students.forEach(s => {
      const chip = el('div', {
        class: 'roster-chip' + (placedIds.has(s.id) ? ' placed' : ''),
        draggable: 'true',
        ondragstart: (e) => { state.dragStudentId = s.id; state.dragFromSeatKey = null; e.dataTransfer.setData('text/plain', s.id); }
      }, [
        text(s.name),
        el('span', { class: 'rm', onclick: () => removeStudent(s.id) }, [text('Remove')])
      ]);
      rlist.appendChild(chip);
    });
    rosterSection.appendChild(rlist);
  }
  side.appendChild(rosterSection);

  return side;
}

function renderMain() {
  const main = el('div', { class: 'main' });

  if (!state.activeChartId || !state.charts[state.activeChartId]) {
    main.appendChild(el('div', { class: 'empty-roster-hint' }, [
      text('Create a chart from the sidebar to get started.')
    ]));
    return main;
  }

  const chart = state.charts[state.activeChartId];
  const chartId = state.activeChartId;

  // Toolbar
  const toolbar = el('div', { class: 'chart-toolbar' });
  const nameInput = el('input', {
    class: 'chart-name-input', value: chart.name,
    onchange: (e) => renameChart(chartId, e.target.value)
  });
  toolbar.appendChild(nameInput);

  const layoutToggle = el('div', { class: 'toggle-group' }, [
    el('button', {
      class: 'toggle-btn' + (chart.layoutType === 'desks' ? ' active' : ''),
      onclick: () => setLayoutType(chartId, 'desks')
    }, [text('Desks')]),
    el('button', {
      class: 'toggle-btn' + (chart.layoutType === 'tables' ? ' active' : ''),
      onclick: () => setLayoutType(chartId, 'tables')
    }, [text('Tables')])
  ]);
  toolbar.appendChild(layoutToggle);

  const rowsCtrl = el('div', { class: 'dim-control' }, [
    text(chart.layoutType === 'tables' ? 'Table rows' : 'Rows'),
    el('input', {
      type: 'number', value: chart.rows, min: '1', max: '12',
      onchange: (e) => resizeChart(chartId, parseInt(e.target.value) || 1, chart.cols)
    })
  ]);
  const colsCtrl = el('div', { class: 'dim-control' }, [
    text(chart.layoutType === 'tables' ? 'Table cols' : 'Cols'),
    el('input', {
      type: 'number', value: chart.cols, min: '1', max: '12',
      onchange: (e) => resizeChart(chartId, chart.rows, parseInt(e.target.value) || 1)
    })
  ]);
  toolbar.appendChild(rowsCtrl);
  toolbar.appendChild(colsCtrl);

  if (chart.layoutType === 'tables') {
    toolbar.appendChild(el('div', { class: 'dim-control' }, [
      text('Seats/table'),
      el('input', {
        type: 'number', value: chart.capacity, min: '1', max: '6',
        onchange: (e) => setCapacity(chartId, parseInt(e.target.value) || 6)
      })
    ]));
  }

  toolbar.appendChild(el('button', {
    class: 'pill-btn secondary', onclick: () => fillAllSeats(chartId)
  }, [text('Seat everyone')]));

  toolbar.appendChild(el('button', {
    class: 'pill-btn secondary', onclick: () => shuffleChart(chartId)
  }, [text('Shuffle seated')]));

  toolbar.appendChild(el('button', {
    class: 'pill-btn secondary', onclick: () => clearAllSeats(chartId)
  }, [text('Clear seats')]));

  toolbar.appendChild(el('button', {
    class: 'pill-btn secondary', onclick: () => window.print()
  }, [text('Print')]));

  toolbar.appendChild(el('div', { class: 'spacer' }));

  const seatedCount = new Set(Object.values(chart.seats)).size;
  toolbar.appendChild(el('div', { class: 'save-status' }, [
    text(`${chart.students.length} student${chart.students.length === 1 ? '' : 's'} · ${seatedCount} seated`)
  ]));
  toolbar.appendChild(el('div', { class: 'save-status' }, [text(state.saveStatus)]));
  main.appendChild(toolbar);

  // Canvas
  const canvasWrap = el('div', { class: 'canvas-wrap' });
  const frame = el('div', { class: 'board-frame' });
  frame.appendChild(el('div', { class: 'front-label' }, [text('Front of room')]));

  const isTables = chart.layoutType === 'tables';
  const unitW = isTables ? 210 : 128;
  const unitH = isTables ? 150 : 84;
  const gridGap = isTables ? 22 : 14;
  const grid = el('div', {
    class: 'grid',
    style: `grid-template-columns: repeat(${chart.cols}, ${unitW}px); grid-template-rows: repeat(${chart.rows}, ${unitH}px); gap: ${gridGap}px;`
  });

  const studentsById = {};
  chart.students.forEach(s => studentsById[s.id] = s);

  for (let r = 0; r < chart.rows; r++) {
    for (let c = 0; c < chart.cols; c++) {
      grid.appendChild(
        isTables
          ? renderTableUnit(chart, chartId, r, c, studentsById)
          : renderDeskUnit(chart, chartId, r, c, studentsById)
      );
    }
  }

  frame.appendChild(grid);
  canvasWrap.appendChild(frame);
  main.appendChild(canvasWrap);

  return main;
}

function renderDeskUnit(chart, chartId, r, c, studentsById) {
  const key = `${r}-${c}-0`;
  const studentId = chart.seats[key];
  const student = studentId ? studentsById[studentId] : null;

  const attrs = {
    class: 'desk ' + (student ? 'filled' : 'empty'),
    ondragover: (e) => { e.preventDefault(); desk.classList.add('drag-over'); },
    ondragleave: () => { desk.classList.remove('drag-over'); },
    ondrop: (e) => {
      e.preventDefault();
      desk.classList.remove('drag-over');
      const sid = e.dataTransfer.getData('text/plain');
      if (sid) moveOrSwapStudent(chartId, sid, key, state.dragFromSeatKey);
      state.dragFromSeatKey = null;
    }
  };
  if (student) {
    attrs.draggable = 'true';
    attrs.ondragstart = (e) => {
      state.dragStudentId = student.id;
      state.dragFromSeatKey = key;
      e.dataTransfer.setData('text/plain', student.id);
    };
  }

  const desk = el('div', attrs, [
    student ? text(student.name) : text('Empty desk')
  ]);
  if (student) {
    desk.appendChild(el('span', {
      class: 'clear-seat', onclick: (e) => { e.stopPropagation(); clearSeat(chartId, key); }
    }, [text('✕')]));
  }
  return desk;
}

function renderTableUnit(chart, chartId, r, c, studentsById) {
  const unit = el('div', { class: 'table-unit' });
  unit.appendChild(el('div', { class: 'table-surface' }, [text(`Table ${r * chart.cols + c + 1}`)]));
  const seatsWrap = el('div', { class: 'table-seats' });

  for (let s = 0; s < chart.capacity; s++) {
    const key = `${r}-${c}-${s}`;
    const studentId = chart.seats[key];
    const student = studentId ? studentsById[studentId] : null;

    const attrs = {
      class: 'table-seat ' + (student ? 'filled' : 'empty'),
      ondragover: (e) => { e.preventDefault(); seat.classList.add('drag-over'); },
      ondragleave: () => { seat.classList.remove('drag-over'); },
      ondrop: (e) => {
        e.preventDefault();
        seat.classList.remove('drag-over');
        const sid = e.dataTransfer.getData('text/plain');
        if (sid) moveOrSwapStudent(chartId, sid, key, state.dragFromSeatKey);
        state.dragFromSeatKey = null;
      }
    };
    if (student) {
      attrs.draggable = 'true';
      attrs.ondragstart = (e) => {
        state.dragStudentId = student.id;
        state.dragFromSeatKey = key;
        e.dataTransfer.setData('text/plain', student.id);
      };
    }

    const seat = el('div', attrs, [student ? text(student.name) : text('+')]);
    if (student) {
      seat.appendChild(el('span', {
        class: 'clear-seat', onclick: (e) => { e.stopPropagation(); clearSeat(chartId, key); }
      }, [text('✕')]));
    }
    seatsWrap.appendChild(seat);
  }

  unit.appendChild(seatsWrap);
  return unit;
}

render();
</script>
